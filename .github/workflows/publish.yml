# Publish to PyPI on every published GitHub release.
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere, not in a
# repository secret and not on a laptop. PyPI verifies the workflow's identity
# directly. Set it up once at
#   https://pypi.org/manage/account/publishing/
# with owner "tonydzi", repository "verbatim-citation-gate", workflow "publish.yml",
# environment "pypi".
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the whole point: OIDC instead of a stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
